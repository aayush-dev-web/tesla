<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesla Sign In</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #30343b;
      background: #fff;
      border-top: 2px solid #8b5bb5;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
    }

    .tesla-logo {
      width: 121px;
      height: auto;
      object-fit: contain;
    }

    .country {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #3d4147;
    }

    .globe {
      width: 20px;
      height: 20px;
      object-fit: contain;
      display: block;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .login-box {
      width: 333px;
      margin-top: 17px;
    }

    h1 {
      font-size: 32px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -1px;
      margin-bottom: 29px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 9px;
    }

    .info {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      margin-left: 3px;
      border: 1px solid #8b8f94;
      border-radius: 50%;
      font-size: 9px;
      font-weight: 700;
      color: #777b80;
      vertical-align: 1px;
    }

    input {
      width: 100%;
      height: 41px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      background: #f5f5f5;
      padding: 0 12px;
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.04);
    }

    input:focus {
      border-color: #777;
      background: #fff;
    }

    .next-btn,
    .create-btn {
      width: 100%;
      height: 41px;
      border: 0;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .next-btn {
      margin-top: 23px;
      background: #9eb3eb;
      color: #fff;
    }

    .next-btn:hover {
      background: #8fa7e5;
    }

    .trouble {
      display: block;
      width: fit-content;
      margin: 27px auto 0;
      color: #33383e;
      font-size: 14px;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 46px 17px 0;
      color: #676b70;
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #dedede;
      flex: 1;
    }

    .create-btn {
      margin-top: 42px;
      background: #f4f4f4;
      color: #30343b;
    }

    .create-btn:hover {
      background: #e9e9e9;
    }

    footer {
      height: 55px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      color: #555a60;
      font-size: 12px;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .header {
        padding: 0 22px;
      }

      .tesla-logo {
        width: 105px;
      }

      .login-box {
        width: calc(100% - 44px);
        margin-top: 30px;
      }

      h1 {
        font-size: 29px;
      }

      footer {
        gap: 12px;
        font-size: 11px;
      }
    }
  
    /* Country selector */
    .country {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      background: transparent;
      padding: 8px 0 8px 8px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #3d4147;
      cursor: pointer;
    }

    .country:hover {
      opacity: .75;
    }

    .country-open {
      overflow: hidden;
    }

    .country-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0);
      visibility: hidden;
      pointer-events: none;
      transition: background .22s ease, visibility 0s linear .22s;
    }

    .country-overlay.open {
      visibility: visible;
      pointer-events: auto;
      background: rgba(0, 0, 0, .28);
      transition: background .22s ease;
    }

    .country-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: min(412px, 100vw);
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: #fff;
      box-shadow: -5px 0 18px rgba(0, 0, 0, .08);
      transform: translateX(100%);
      transition: transform .25s cubic-bezier(.2, .8, .2, 1);
      scrollbar-width: thin;
      scrollbar-color: #999 transparent;
    }

    .country-overlay.open .country-panel {
      transform: translateX(0);
    }

    .close-country {
      position: absolute;
      top: 20px;
      right: 30px;
      width: 25px;
      height: 25px;
      border: 0;
      background: transparent;
      color: #555;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 31px;
      font-weight: 300;
      line-height: 20px;
      cursor: pointer;
      padding: 0;
      z-index: 2;
    }

    .close-country:hover {
      color: #111;
    }

    .country-content {
      padding: 100px 25px 60px 35px;
    }

    .region {
      margin: 0 0 66px;
    }

    .region h2 {
      margin: 0 0 10px;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 600;
      color: #101418;
    }

    .country-option {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 4px;
      background: transparent;
      text-align: left;
      padding: 10px 12px;
      margin: 0 0 3px;
      color: #101418;
      cursor: pointer;
    }

    .country-option:hover {
      background: #f4f4f4;
    }

    .country-option.selected {
      background: #f1f1f1;
    }

    .country-option strong,
    .country-option span {
      display: block;
    }

    .country-option strong {
      font-size: 14px;
      line-height: 1.35;
      font-weight: 600;
    }

    .country-option span {
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.25;
      color: #555b61;
      font-weight: 400;
    }

    @media (max-width: 600px) {
      .country-panel {
        width: 100vw;
      }

      .country-content {
        padding-left: 24px;
        padding-right: 20px;
      }

      .close-country {
        right: 22px;
      }
    }

  </style>
</head>
<body>

  <header class="header">
    <A href="home.html"><img src="tesla.png" alt="Tesla" class="tesla-logo"></A>

    <button class="country" id="countryButton" type="button" aria-label="Select country">
      <img src="globe.png" alt="" class="globe">
      <span id="currentCountry">US</span>
    </button>
  </header>

  <main>
    <section class="login-box">
      <h1>Sign In</h1>

      <form>
        <label for="email">
          Email <span class="info">i</span>
        </label>

        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          autofocus
        >

        <button class="next-btn" type="submit">Next</button>

        <a href="trouble.html" class="trouble">Trouble Signing In?</a>

        <div class="divider">
          <span>Or</span>
        </div>

        <a href="create-account.html"><button class="create-btn" type="button">
          Create Account
        </button></a>
      </form>
    </section>
  </main>

  <footer>
    <span>Tesla © 2026</span>
    <a href="#">Privacy &amp; Legal</a>
    <a href="#">Contact</a>
  </footer>


  <!-- Country / Region selector -->
  <div class="country-overlay" id="countryOverlay" aria-hidden="true">
    <aside class="country-panel" role="dialog" aria-modal="true" aria-label="Country and region selector">
      <button class="close-country" id="closeCountry" type="button" aria-label="Close">×</button>

      <div class="country-content">
        <section class="region">
          <h2>North America</h2>

          <button class="country-option selected" data-country="US">
            <strong>United States</strong>
            <span>English</span>
          </button>

          <button class="country-option" data-country="CA">
            <strong>Canada</strong>
            <span>English &nbsp;&nbsp; Français</span>
          </button>

          <button class="country-option" data-country="MX">
            <strong>México</strong>
            <span>Español</span>
          </button>

          <button class="country-option" data-country="PR">
            <strong>Puerto Rico</strong>
            <span>English &nbsp;&nbsp; Español</span>
          </button>
        </section>

        <section class="region">
          <h2>South America</h2>

          <button class="country-option" data-country="CL">
            <strong>Chile</strong>
            <span>Español</span>
          </button>

          <button class="country-option" data-country="CO">
            <strong>Colombia</strong>
            <span>Español</span>
          </button>

          <button class="country-option" data-country="UY">
            <strong>Uruguay</strong>
            <span>Español</span>
          </button>
        </section>

        <section class="region">
          <h2>Europe</h2>

          <button class="country-option" data-country="BE">
            <strong>Belgium</strong>
            <span>Nederlands &nbsp;&nbsp; Français</span>
          </button>

          <button class="country-option" data-country="BG">
            <strong>Bulgaria</strong>
            <span>English</span>
          </button>

          <button class="country-option" data-country="CY">
            <strong>Cyprus</strong>
            <span>English</span>
          </button>

          <button class="country-option" data-country="CZ">
            <strong>Česko</strong>
            <span>Čeština</span>
          </button>

          <button class="country-option" data-country="DK">
            <strong>Danmark</strong>
            <span>Dansk</span>
          </button>

          <button class="country-option" data-country="DE">
            <strong>Deutschland</strong>
            <span>Deutsch</span>
          </button>

          <button class="country-option" data-country="GR">
            <strong>Ελλάδα</strong>
            <span>Ελληνικά</span>
          </button>

          <button class="country-option" data-country="ES">
            <strong>España</strong>
            <span>Español</span>
          </button>

          <button class="country-option" data-country="FR">
            <strong>France</strong>
            <span>Français</span>
          </button>

          <button class="country-option" data-country="HR">
            <strong>Hrvatska</strong>
            <span>Hrvatski</span>
          </button>

          <button class="country-option" data-country="IT">
            <strong>Italia</strong>
            <span>Italiano</span>
          </button>

          <button class="country-option" data-country="NL">
            <strong>Nederland</strong>
            <span>Nederlands</span>
          </button>

          <button class="country-option" data-country="NO">
            <strong>Norge</strong>
            <span>Norsk</span>
          </button>

          <button class="country-option" data-country="PL">
            <strong>Polska</strong>
            <span>Polski</span>
          </button>

          <button class="country-option" data-country="PT">
            <strong>Portugal</strong>
            <span>Português</span>
          </button>

          <button class="country-option" data-country="CH">
            <strong>Schweiz</strong>
            <span>Deutsch &nbsp;&nbsp; Français &nbsp;&nbsp; Italiano</span>
          </button>

          <button class="country-option" data-country="SE">
            <strong>Sverige</strong>
            <span>Svenska</span>
          </button>

          <button class="country-option" data-country="GB">
            <strong>United Kingdom</strong>
            <span>English</span>
          </button>
        </section>

        <section class="region">
          <h2>Asia Pacific</h2>

          <button class="country-option" data-country="AU">
            <strong>Australia</strong>
            <span>English</span>
          </button>

          <button class="country-option" data-country="HK">
            <strong>Hong Kong</strong>
            <span>English &nbsp;&nbsp; 繁體中文</span>
          </button>

          <button class="country-option" data-country="JP">
            <strong>日本</strong>
            <span>日本語</span>
          </button>

          <button class="country-option" data-country="NZ">
            <strong>New Zealand</strong>
            <span>English</span>
          </button>

          <button class="country-option" data-country="SG">
            <strong>Singapore</strong>
            <span>English</span>
          </button>

          <button class="country-option" data-country="KR">
            <strong>대한민국</strong>
            <span>한국어</span>
          </button>
        </section>

        <section class="region">
          <h2>Middle East & Africa</h2>

          <button class="country-option" data-country="AE">
            <strong>United Arab Emirates</strong>
            <span>English</span>
          </button>

          <button class="country-option" data-country="IL">
            <strong>Israel</strong>
            <span>English</span>
          </button>

          <button class="country-option" data-country="ZA">
            <strong>South Africa</strong>
            <span>English</span>
          </button>
        </section>
      </div>
    </aside>
  </div>

  <script>
    const countryButton = document.getElementById("countryButton");
    const countryOverlay = document.getElementById("countryOverlay");
    const closeCountry = document.getElementById("closeCountry");
    const currentCountry = document.getElementById("currentCountry");
    const countryOptions = document.querySelectorAll(".country-option");

    function openCountrySelector() {
      countryOverlay.classList.add("open");
      countryOverlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("country-open");
      closeCountry.focus();
    }

    function closeCountrySelector() {
      countryOverlay.classList.remove("open");
      countryOverlay.setAttribute("aria-hidden", "true");
      document.body.classList.remove("country-open");
      countryButton.focus();
    }

    countryButton.addEventListener("click", openCountrySelector);
    closeCountry.addEventListener("click", closeCountrySelector);

    countryOverlay.addEventListener("click", (event) => {
      if (event.target === countryOverlay) {
        closeCountrySelector();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && countryOverlay.classList.contains("open")) {
        closeCountrySelector();
      }
    });

    countryOptions.forEach(option => {
      option.addEventListener("click", () => {
        countryOptions.forEach(item => item.classList.remove("selected"));
        option.classList.add("selected");

        currentCountry.textContent = option.dataset.country;
        closeCountrySelector();
      });
    });
  </script>

</body>
</html>
